# ==========================================================================
# EaseTrading — local stack (optional; you can also run the apps directly).
# From the infra/ folder:
#   docker compose --env-file ../.env up --build
#
#   api       : Spring Boot backend — its database is ONE SQLite file kept in
#               the "apidata" volume (no Postgres, no Redis)
#   analysis  : Python FastAPI (indicators, screener, verdicts)
#   web       : Next.js frontend
#
# Every port is bound to 127.0.0.1 only: with a real broker connected, your
# portfolio must not be reachable from other machines on your network until
# login is added (issue B6).
# ==========================================================================
services:
  api:
    build: ../apps/api
    environment:
      DB_PATH: /app/data/easetrading.db
      JWT_SECRET: ${JWT_SECRET}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-mock}
      GROWW_AUTH_MODE: ${GROWW_AUTH_MODE:-approval}
      GROWW_API_KEY: ${GROWW_API_KEY:-}
      GROWW_API_SECRET: ${GROWW_API_SECRET:-}
      GROWW_TOTP_SECRET: ${GROWW_TOTP_SECRET:-}
      GROWW_ACCESS_TOKEN: ${GROWW_ACCESS_TOKEN:-}
      ANALYSIS_SERVICE_URL: http://analysis:8000
    volumes:
      - apidata:/app/data
    ports:
      - "127.0.0.1:8080:8080"

  analysis:
    build: ../apps/analysis
    environment:
      FUNDAMENTALS_MODE: ${FUNDAMENTALS_MODE:-mock}
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ../apps/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  apidata:
