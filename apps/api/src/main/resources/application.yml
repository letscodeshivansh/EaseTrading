# ==========================================================================
# Spring Boot configuration. Values come from environment variables (set by
# docker-compose / .env) with sensible local defaults after the ":".
# ==========================================================================
spring:
  application:
    name: easetrading-api

  # The whole database is ONE SQLite file — nothing to install or run.
  # It holds only what the app itself owns: watchlist, alerts,
  # analysis history, audit log, users. Everything the broker owns is fetched live.
  datasource:
    # WAL = readers never block the writer; busy_timeout = a writer waits up to 5 s
    # for another write instead of failing with "database is locked".
    url: jdbc:sqlite:${DB_PATH:easetrading.db}?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # A few connections so one slow request can't freeze the rest (a single
      # connection caused a deadlock, B26). SQLite still serialises the writes.
      maximum-pool-size: 4

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # "update" creates/updates tables from our @Entity classes.
      ddl-auto: update
    open-in-view: false

server:
  # Cloud hosts (Render, Railway, etc.) inject the port to listen on via $PORT.
  # Locally it defaults to 8080.
  port: ${PORT:8080}
  # Listen on this Mac only. Other devices reach the app through Tailscale Serve
  # (private to your own devices), never directly over Wi-Fi. Docker sets 0.0.0.0.
  address: ${SERVER_ADDRESS:127.0.0.1}

# ---- Application-specific settings ----
easetrading:
  security:
    # Secret used to sign JWTs (app login).
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    # Stay logged in for 7 days.
    jwt-expiry-minutes: 10080
    # Google sign-in: the OAuth "Web client" ID from Google Cloud Console. Empty = Google button hidden.
    google-client-id: ${GOOGLE_CLIENT_ID:}
  broker:
    # Where prices, the stock list and your portfolio come from:
    #   "mock"  = simulated data, no credentials (default)
    #   "groww" = the real Groww Trade API (needs GROWW_* below)
    provider: ${BROKER_PROVIDER:mock}
  groww:
    base-url: https://api.groww.in
    instruments-url: https://growwapi-assets.groww.in/instruments/instrument.csv
    # token | approval | totp — see .env.example
    auth-mode: ${GROWW_AUTH_MODE:approval}
    access-token: ${GROWW_ACCESS_TOKEN:}
    api-key: ${GROWW_API_KEY:}
    api-secret: ${GROWW_API_SECRET:}
    totp-secret: ${GROWW_TOTP_SECRET:}
  analysis:
    service-url: ${ANALYSIS_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.easetrading: DEBUG
